[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "turn-signal-crash-rate"
version = "0.1.0"
description = "US rear turn-signal colour vs fatal crash rate – reproducible analysis pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
]

[project.scripts]
tsca = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
