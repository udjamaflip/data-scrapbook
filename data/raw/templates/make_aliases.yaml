# make_aliases.yaml
#
# Maps canonical make names → list of known variants/aliases.
# Used by vehicle_normalization.py to standardise make names across datasets.
#
# Format:
#   Canonical Name:
#     - Alias 1
#     - Alias 2
#
# Rules:
#   - Matching is case-insensitive and ignores punctuation.
#   - Add entries whenever you encounter a new spelling in a source dataset.
#   - Do NOT remove existing entries without checking all source files.

