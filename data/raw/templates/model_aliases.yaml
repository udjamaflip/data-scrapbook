# model_aliases.yaml
#
# Maps canonical model names → list of known variants/aliases.
# Used by vehicle_normalization.py to standardise model names across datasets.
#
# Format:
#   Canonical Model:
#     - Alias 1
#     - Alias 2
#
# Notes:
#   - Matching is per-make – this file handles cross-dataset spelling differences.
#   - For make-specific model conflicts, use manual_vehicle_overrides.csv instead.
#   - Keep entries alphabetical within each make.

# --- Chevrolet ---
Silverado 1500:
  - Silverado1500
  - C/K 1500
  - C/K1500

